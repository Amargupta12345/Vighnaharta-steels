<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a4a6b"/>
      <stop offset="100%" stop-color="#1e2535"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="80" height="80" rx="16" fill="url(#steelGrad)"/>
  <!-- Abstract steel beam / V+S monogram -->
  <!-- V shape (Vighnaharta) -->
  <polygon points="20,22 40,58 60,22 52,22 40,48 28,22" fill="#FF6F00"/>
  <!-- Two horizontal bars (steel beams) -->
  <rect x="22" y="60" width="36" height="5" rx="2" fill="#B0BEC5"/>
  <rect x="28" y="68" width="24" height="4" rx="2" fill="#B0BEC5" opacity="0.6"/>
</svg>
